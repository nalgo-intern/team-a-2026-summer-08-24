requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "kaggle>=2.2.4",
    "kornia>=0.8.3",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "tensorflow>=2.21.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
]
